<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Andes to Copacabana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0F1D1C; --bg2:#0B1615; --surface:#15272A; --surface2:#1B3235; --surface3:#22393C; --line:#2A4346; --line2:#213539;
  --ink:#EDE7D6; --ink2:#C9C3B2; --muted:#8C9C97; --faint:#5C6F6A;
  --accent:#FF9A3C; --accent2:#FFB46B; --accent-ink:#1A0E05; --accent-soft:rgba(255,154,60,.16); --accent-glow:rgba(255,154,60,.45);
  --teal:#5FC8C0; --teal-soft:rgba(95,200,192,.16);
  --sea:#0B1A1E; --sea2:#0E2227; --grat:rgba(95,200,192,.07);
  --pe:#3A3B2C; --ec:#2F3B2E; --co:#3D3529; --br:#2A3A30; --bo:#3A362A; --gy:#2E3B34; --sr:#343B2E; --gf:#303A33; --cl:#2C3339; --ar:#3A3330; --py:#33392C; --other:#1C2826; --border:#4A5F5A; --coast:#6B857E;
  --good:#5FCB8B; --warn:#E6B54A; --bad:#F06A5A;
  --shadow:0 14px 40px rgba(0,0,0,.5); --shadow-s:0 4px 14px rgba(0,0,0,.35);
  --r:16px; --r-s:10px;
  --display:"Bricolage Grotesque","Figtree","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pin-halo:#0F1D1C; --glass:rgba(21,39,42,.80); --glass2:rgba(16,30,33,.88); --glass-line:rgba(255,255,255,.07); --pw:460px; --hh:96px; --sheet:46vh;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF0EA; --bg2:#E3E7DF; --surface:#F7F8F4; --surface2:#FFFFFF; --surface3:#EEF1EB; --line:#CDD5CC; --line2:#DDE3DA;
    --ink:#15211F; --ink2:#3E4E4A; --muted:#6E7E78; --faint:#9AA8A2;
    --accent:#DB6A1E; --accent2:#B5500F; --accent-ink:#FFF7F0; --accent-soft:rgba(219,106,30,.14); --accent-glow:rgba(219,106,30,.35);
    --teal:#1E8F87; --teal-soft:rgba(30,143,135,.12);
    --sea:#D3E2E2; --sea2:#C6D8D8; --grat:rgba(30,143,135,.08);
    --pe:#E8DDBF; --ec:#D9E1C2; --co:#E4D2BF; --br:#CBDDC9; --bo:#E2D8C3; --gy:#D3DFCD; --sr:#DEE2CA; --gf:#D5DED1; --cl:#D3DCE3; --ar:#E6D7CF; --py:#DDE3CC; --other:#E2E6DF; --border:#B7C4BC; --coast:#8FA39C;
    --good:#2F8F5B; --warn:#B8811A; --bad:#C43C2C;
    --shadow:0 14px 40px rgba(20,33,31,.14); --shadow-s:0 4px 14px rgba(20,33,31,.10);
    --pin-halo:#FFFFFF; --glass:rgba(247,248,244,.84); --glass2:rgba(247,248,244,.92); --glass-line:rgba(20,33,31,.08);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF0EA; --bg2:#E3E7DF; --surface:#F7F8F4; --surface2:#FFFFFF; --surface3:#EEF1EB; --line:#CDD5CC; --line2:#DDE3DA;
  --ink:#15211F; --ink2:#3E4E4A; --muted:#6E7E78; --faint:#9AA8A2;
  --accent:#DB6A1E; --accent2:#B5500F; --accent-ink:#FFF7F0; --accent-soft:rgba(219,106,30,.14); --accent-glow:rgba(219,106,30,.35);
  --teal:#1E8F87; --teal-soft:rgba(30,143,135,.12);
  --sea:#D3E2E2; --sea2:#C6D8D8; --grat:rgba(30,143,135,.08);
  --pe:#E8DDBF; --ec:#D9E1C2; --co:#E4D2BF; --br:#CBDDC9; --bo:#E2D8C3; --gy:#D3DFCD; --sr:#DEE2CA; --gf:#D5DED1; --cl:#D3DCE3; --ar:#E6D7CF; --py:#DDE3CC; --other:#E2E6DF; --border:#B7C4BC; --coast:#8FA39C;
  --good:#2F8F5B; --warn:#B8811A; --bad:#C43C2C;
  --shadow:0 14px 40px rgba(20,33,31,.14); --shadow-s:0 4px 14px rgba(20,33,31,.10);
  --pin-halo:#FFFFFF; --glass:rgba(247,248,244,.84); --glass2:rgba(247,248,244,.92); --glass-line:rgba(20,33,31,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;font-family:var(--display);text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
.app{position:relative;height:100vh;height:100dvh;min-height:520px;overflow:hidden}

/* ---------- header ---------- */
.top{position:absolute;left:14px;right:14px;top:12px;z-index:6;display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center;padding:9px 14px 9px 12px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;box-shadow:var(--shadow-s)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 18px var(--accent-glow);flex:none}
.brand .mark svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub b{color:var(--ink2);font-weight:600}
.meter{display:grid;gap:4px;min-width:200px;max-width:640px;justify-self:center;width:100%}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:11.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.meter-head strong{color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:600}
.meter-head .miss{color:var(--bad);font-weight:700}
.meter-bar{position:relative;height:12px;border-radius:6px;background:var(--bg2);overflow:hidden;display:flex;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.meter-bar span{height:100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.meter-bar .over{background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 10px)}
.meter-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.meter-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--border)}
.hdr-right{display:flex;gap:8px;align-items:center}
.iconbtn{height:35px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface2);display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:12.5px;color:var(--ink2);transition:all .15s;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent);color:var(--ink)}
.iconbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.field{display:grid;gap:3px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-s);padding:7px 9px;font-family:var(--mono);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);width:150px}
.field input[type=number]{width:92px}
.field .lock{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r-s);padding:7px 10px;font-family:var(--mono);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);display:flex;gap:8px;align-items:center;height:35px}
.field .lock svg{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:2}

/* ---------- map ---------- */
.main{position:absolute;inset:0}
.left{position:absolute;inset:0}
.filters{position:absolute;left:14px;top:var(--hh);z-index:5;display:flex;gap:5px;flex-wrap:wrap;align-items:center;max-width:calc(100% - var(--pw) - 56px)}
.chip{border:1px solid var(--glass-line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-s);transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-1px)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.wx{border-color:var(--teal)}
.chip.lock.on{background:var(--teal);color:#062A28;border-color:var(--teal)}
.filters .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.dd{position:relative}
.dd .car{font-size:10px;color:var(--muted);margin-left:2px}
.dd .menu{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:220px;background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-line);border-radius:14px;padding:6px;box-shadow:var(--shadow);z-index:20}
.dd.open .menu{display:grid;gap:1px}
.dd.open .chip{border-color:var(--accent)}
.mi{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;padding:7px 9px;border-radius:9px;font-size:12.5px;color:var(--ink2);text-align:left}
.mi:hover{background:var(--accent-soft);color:var(--ink)}
.mi.on{background:var(--ink);color:var(--bg)}
.mi i{width:10px;height:10px;border-radius:3px;border:1px solid var(--border);display:block}
.mi i.none{border-style:dashed;background:transparent}
.mi i.box{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6)}
.mi i.box.plain{background:var(--surface2);color:var(--accent)}
.mi.chk.on{background:var(--accent-soft);color:var(--ink)}
.mi.chk.on i.box.plain{background:var(--accent);color:var(--accent-ink);text-shadow:none}
.mi small{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.mi.on small{color:var(--bg);opacity:.7}
.seg{display:inline-flex;border:1px solid var(--glass-line);border-radius:999px;background:var(--glass2);backdrop-filter:blur(12px);padding:3px;gap:2px;box-shadow:var(--shadow-s)}
.seg button{padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--muted);transition:all .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}

.mapwrap{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,var(--sea2),var(--sea));overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.mapwrap svg.dragging{cursor:grabbing}
.grat{stroke:var(--grat);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.country{fill:var(--other);stroke:var(--coast);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .25s,opacity .25s;stroke-linejoin:round}
.country.PE{fill:var(--pe)} .country.EC{fill:var(--ec)} .country.CO{fill:var(--co)} .country.BR{fill:var(--br)} .country.BO{fill:var(--bo)} .country.GY{fill:var(--gy)} .country.SR{fill:var(--sr)} .country.GF{fill:var(--gf)} .country.CL{fill:var(--cl)} .country.AR{fill:var(--ar)} .country.PY{fill:var(--py)}
.country.dim{opacity:.4}
.country.hot{filter:brightness(1.12)}
.coast-glow{fill:none;stroke:var(--teal);stroke-opacity:.18;stroke-width:6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.clabel{font-family:var(--display);font-weight:800;fill:var(--ink);opacity:.28;letter-spacing:.2em;text-transform:uppercase;pointer-events:none}
.route{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.route.fly{stroke-dasharray:7 6;stroke-width:2;animation:dash 1.6s linear infinite}
.route.boat{stroke-dasharray:2 5;stroke-width:2.6;animation:dash 1.8s linear infinite}
.route-glow{fill:none;stroke:var(--accent);stroke-opacity:.16;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.route.future,.route-glow.future{stroke:var(--faint);opacity:.45;animation:none}
.pin.future .photo-g,.pin.future .dot{opacity:.35;filter:grayscale(1)}
.pin.future .ring2,.pin.future .badge{opacity:.35}.pin.future text.lbl{opacity:.35}
.pin.past .photo-g{filter:saturate(.6)}
.curchip{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--hh) + 44px);z-index:5;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.curchip b{color:var(--accent)}.curchip u{opacity:.8}
.route-hit{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
.route-hit:hover + .route-glow{stroke-opacity:.4}
@keyframes dash{to{stroke-dashoffset:-26}}
.walker{fill:var(--accent);stroke:var(--pin-halo);stroke-width:2;filter:drop-shadow(0 0 6px var(--accent-glow))}
@media (prefers-reduced-motion:reduce){.route.fly,.route.boat{animation:none}.walker{display:none}}

/* pins: zoom-level logic */
.pin{cursor:pointer}
.pin .dot{fill:var(--surface2);stroke:var(--coast);stroke-width:1.6;transition:all .15s}
.pin .photo-g{opacity:0;transition:opacity .2s,transform .15s;transform-box:fill-box;transform-origin:center}
.pin:hover .photo-g{transform:scale(1.35)}
.pin.sel .photo-g{transform:scale(1.25)}
.pin .ring{fill:none;stroke:var(--pin-halo);stroke-width:2.5}
.pin .ring2{fill:none;stroke:var(--coast);stroke-width:1;opacity:.7}
/* far: only tier1 photos + labels */
svg.z-far .pin.t1 .photo-g,svg.z-mid .pin.t1 .photo-g,svg.z-mid .pin.t2 .photo-g,svg.z-near .pin .photo-g,.pin.on .photo-g,.pin.sel .photo-g{opacity:1}
svg.z-far .pin.t1 .dot,svg.z-mid .pin.t1 .dot,svg.z-mid .pin.t2 .dot,svg.z-near .pin .dot,.pin.on .dot,.pin.sel .dot{opacity:0}
svg.z-far .pin.t2 .dot{r:6;stroke:var(--accent);stroke-width:1.4}
svg.z-far .pin.t3 .dot{r:3.5}
.pin.on .ring2{stroke:var(--accent);stroke-width:2.5;opacity:1}
.pin.on .dot{fill:var(--accent);stroke:var(--pin-halo)}
.pin.sel .ring2{stroke:var(--accent);stroke-width:3;opacity:1}
.pin.t1 .ring2{stroke:var(--accent);stroke-width:2.2;opacity:1}
.pin .pulse{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.pin.sel .pulse{opacity:1;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:12;opacity:.9}100%{r:30;opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.sel .pulse{animation:none;r:24;opacity:.6}}
.pin .badge{fill:var(--accent)} .pin .badge-t{font-family:var(--mono);font-size:8.5px;font-weight:600;fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .badge,.pin .badge-t{opacity:0}
.pin.on .badge,.pin.on .badge-t{opacity:1}
.pin .star{fill:var(--accent);stroke:var(--pin-halo);stroke-width:1;opacity:0}
.pin.t1 .star{opacity:1}
.pin text.lbl{font-family:var(--body);font-size:9.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;text-anchor:middle;opacity:0;transition:opacity .15s}
.pin.t1 text.lbl{font-weight:800;font-size:10.5px}
svg.z-far .pin.t1 text.lbl,svg.z-mid .pin.t1 text.lbl,svg.z-mid .pin.t2.on text.lbl,svg.z-near .pin text.lbl,.pin:hover text.lbl,.pin.sel text.lbl,.labels-on .pin text.lbl{opacity:1}
svg.z-far .pin.on:not(.sel):not(:hover):not(.t1) text.lbl{opacity:0}
.pin .daylbl{font-family:var(--mono);font-size:9.5px;font-weight:600;fill:var(--accent-ink);text-anchor:middle;opacity:0;pointer-events:none;paint-order:stroke;stroke:var(--accent);stroke-width:6px;stroke-linejoin:round;transition:opacity .2s}
.pin.dayon .daylbl{opacity:1}
.pin.dayon .pulse{opacity:1;animation:pulse 1s ease-out infinite}
.pin.lblhide text.lbl{opacity:0!important}
.pin.lblhide:hover text.lbl{opacity:1!important}
.pois .poi{display:none;cursor:pointer}
svg.z-poi .pois .poi{display:block}
.poi circle{fill:var(--teal);stroke:var(--pin-halo);stroke-width:1.5}
.poi .pk{font-size:5px;fill:#062A28;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.poi .pl{font-family:var(--body);font-size:7.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:2.5px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.poi.hot circle{fill:var(--accent);r:6}
.pin.hidden{display:none}
.pin.faded{opacity:.3}
.pin .wxr{fill:none;stroke-width:3;opacity:0}
svg.wx .pin .wxr{opacity:.95}
.pin.wx-g .wxr{stroke:var(--good)}.pin.wx-a .wxr{stroke:var(--warn)}.pin.wx-r .wxr{stroke:var(--bad)}
.pin .nearr{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:3 3;opacity:0}
.pin.near .nearr{opacity:.9}
.pin.near .photo-g,.pin.near .dot{opacity:1}
.pin.near text.lbl{opacity:1}

.mapctl{position:absolute;right:calc(var(--pw) + 28px);top:var(--hh);display:grid;gap:6px;z-index:4}
.mapctl button{width:34px;height:34px;border-radius:10px;background:var(--glass2);backdrop-filter:blur(12px);border:1px solid var(--glass-line);box-shadow:var(--shadow-s);font-family:var(--mono);font-size:16px;color:var(--ink);transition:all .15s;display:grid;place-items:center}
.mapctl button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.mapctl button svg{width:16px;height:16px;fill:currentColor}
.mapctl button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{position:absolute;left:14px;bottom:14px;background:var(--glass2);backdrop-filter:blur(12px);border:1px solid var(--glass-line);border-radius:12px;padding:8px 12px;font-size:11px;color:var(--muted);display:grid;gap:4px;box-shadow:var(--shadow-s);z-index:4}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:22px;height:0;border-top:2.4px solid var(--accent);display:inline-block}
.legend i.fly{border-top-style:dashed} .legend i.boat{border-top-style:dotted;border-top-width:3px}
.legend .tips{border-top:1px solid var(--glass-line);margin-top:3px;padding-top:5px;color:var(--faint)}.legend .tips b{color:var(--muted);font-weight:600}
.legend .wxl{display:none;border-top:1px solid var(--glass-line);margin-top:3px;padding-top:5px}.legend.wx .wxl{display:grid;gap:3px}.legend .wxl i{width:9px;height:9px;border-radius:50%;border:0}.legend .wxl i.g{background:var(--good)}.legend .wxl i.a{background:var(--warn)}.legend .wxl i.r{background:var(--bad)}
.tip{position:absolute;pointer-events:none;width:220px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;transform:translate(-50%,calc(-100% - 22px));opacity:0;transition:opacity .12s,transform .12s;box-shadow:var(--shadow);z-index:5}
.tip img{width:100%;height:110px;object-fit:cover;display:block}
.tip .tt{padding:9px 11px 10px;display:grid;gap:2px}

.hostel .nm .price{font-family:var(--mono);font-size:11.5px;color:var(--accent2);letter-spacing:.06em}
.hostel .nm .rate{font-family:var(--mono);font-size:11px;color:var(--good)}
.hostel .nm .gem{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:2px 6px}
.hostel .nm .verify{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:1px 5px}
.hostel .area{font-size:11.5px;color:var(--muted)}
.hostel .more{display:none;gap:5px}
.hostel.open .more{display:grid}
.hostel p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.hostel .feat{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.hostel .feat span{font-size:10.5px;color:var(--ink2);background:var(--bg2);border-radius:6px;padding:2px 7px;display:inline-flex;gap:4px;align-items:center}
.hostel .feat span svg{width:11px;height:11px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hostel .links{display:flex;gap:6px;margin-top:3px}
.hostel .links a{font-size:11px;font-weight:700;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;transition:all .15s;display:inline-flex;gap:5px;align-items:center}
.hostel .links a:hover{border-color:var(--accent);color:var(--accent2)}
.hostel .links a svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hostel .nm .pickb{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#062A28;background:var(--teal);border-radius:5px;padding:2px 6px}
.hostel .links .pickbtn{font-size:11px;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:7px;padding:3px 9px}
.rstop .who .bed{font-family:var(--body);font-size:11px;color:var(--teal)}
.detours{display:grid;gap:8px}
.dstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.dcard{flex:0 0 210px;scroll-snap-align:start;border-radius:12px;overflow:hidden;background:var(--surface2);border:1.5px solid var(--line2);text-align:left;padding:0;display:grid;grid-template-rows:90px auto;transition:transform .15s,border-color .15s}
.dcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.dcard img{width:100%;height:90px;object-fit:cover;display:block}
.dcard .cap{padding:7px 9px 9px;display:grid;gap:2px}
.dcard b{font-family:var(--display);font-size:13px;font-weight:700;line-height:1.15}
.dcard small{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.dcard em{font-style:normal;font-size:11.5px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hostel .chev{position:absolute;right:10px;top:10px;color:var(--faint);font-size:11px;transition:transform .15s}
.hostel.open .chev{transform:rotate(180deg)}
.vb.party{background:#B8452C!important}.vb.social{background:#B57A17!important}.vb.chill{background:#1F7F73!important}.vb.boutique{background:#6A4E9C!important}.vb.surf{background:#1F6E9C!important}.vb.eco{background:#3F7A34!important}
.stripe.party{background:#E0674A}.stripe.social{background:#E8A93A}.stripe.chill{background:#3FB5A5}.stripe.boutique{background:#9B7FD1}.stripe.surf{background:#4FA3D6}.stripe.eco{background:#67B15A}
.empty{padding:44px 24px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{font-size:20px;font-weight:700;color:var(--ink)}
.empty p{margin:0;max-width:36ch}
.empty.photo{padding:0;border-radius:14px;overflow:hidden;position:relative;display:block;text-align:left;min-height:170px}
.empty.photo img{width:100%;height:190px;object-fit:cover;display:block}
.empty.photo .et{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.72));color:#fff;display:grid;align-content:end;padding:14px 16px;gap:4px}
.empty.photo h2{color:#fff;font-size:20px}.empty.photo p{color:rgba(255,255,255,.88);max-width:44ch}
.small-note{font-size:12px;color:var(--muted)}
.credits-link{font-size:12px;color:var(--muted)}.credits-link button{color:var(--teal);text-decoration:underline;font-size:12px}

/* weather */
.wxbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--bg2);border-radius:12px;padding:10px 12px}
.wxbox .big{display:grid;justify-items:center;gap:2px;min-width:70px}
.wxbox .big b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.wxbox .big small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wxbox .pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff}
.pill.g{background:var(--good);color:#06301A}.pill.a{background:var(--warn);color:#3A2600}.pill.r{background:var(--bad)}
.wxbox .txt{display:grid;gap:5px;font-size:12.5px;color:var(--ink2)}
.wxbox .txt .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.wxstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wxstrip div{display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px 4px;border-radius:8px;background:var(--bg2)}
.wxstrip div.cur{outline:2px solid var(--accent);color:var(--ink)}
.wxstrip b{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:600}
.wxstrip i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line)}
.wxstrip i.g{background:var(--good)}.wxstrip i.a{background:var(--warn)}.wxstrip i.r{background:var(--bad)}
.wxstrip .sea{color:var(--teal);font-family:var(--mono);font-size:10px}
.wxm{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.wxm i{width:8px;height:8px;border-radius:50%;display:inline-block}
.wxm i.g{background:var(--good)}.wxm i.a{background:var(--warn)}.wxm i.r{background:var(--bad)}

/* route tab */
.settings2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg2);border-radius:12px;padding:9px 12px}
.settings2 .f{display:grid;gap:1px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.settings2 .f input{border:0;background:transparent;padding:0;font-family:var(--mono);font-size:14px;color:var(--ink);letter-spacing:0;text-transform:none;font-weight:600;width:130px}
.settings2 .f input[type=number]{width:52px}
.settings2 .f .in,.settings2 .f b{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none}
.settings2 .f.lock b::before{content:"🔒 ";font-size:11px}
.settings2 .arr{color:var(--faint)}
.settings2 .days{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.settings2 .tempo input{width:110px;accent-color:var(--accent)}
.settings2 .help{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;display:grid;place-items:center;cursor:help}

.route-pane{padding:14px 16px 28px;display:grid;gap:14px}
.settings{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:var(--bg2);border-radius:12px;padding:10px 12px}
.settings .field input{width:140px}
.settings .field input[type=number]{width:84px}
.settings .arrow{color:var(--faint);padding-bottom:9px}
.settings .help{flex-basis:100%;font-size:11.5px;color:var(--muted)}
.today{display:grid;grid-template-columns:96px 1fr;gap:12px;background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--accent);border-radius:14px;overflow:hidden}
.today img{width:100%;height:100%;object-fit:cover;display:block;min-height:96px}
.today .tb{padding:10px 12px 12px;display:grid;gap:4px}
.today .tb .e{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:800}
.today .tb h3{font-size:18px;font-weight:800}
.today .tb .l{font-size:12.5px;color:var(--ink2)}
.today .tb .l b{font-weight:700}
.today .tb .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.today .tb .links a,.today .tb .links button{font-size:11px;font-weight:700;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:3px 9px}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.summary .fact b{font-size:14px}
.timeline{background:var(--bg2);border-radius:12px;padding:8px 10px 6px;display:grid;gap:6px;user-select:none}
.tlscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:4px;scrollbar-width:thin}
.timeline .months{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.timeline .months span{position:absolute;top:0;border-left:1px solid var(--line);padding-left:4px;line-height:14px}
.timeline .bars{position:relative;height:64px;display:flex;gap:2px}
.tb{position:relative;flex:none;height:100%;border-radius:8px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;transition:filter .15s,transform .15s;box-shadow:inset 0 -28px 24px -10px rgba(0,0,0,.75)}
.tb:hover{transform:translateY(-2px)}
.tb.cur{outline:2px solid var(--accent);outline-offset:-2px}
.tb.fut{filter:grayscale(1) brightness(.6)}
.tb .n{position:absolute;left:5px;right:12px;bottom:14px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.tb .d{position:absolute;left:5px;bottom:3px;font-family:var(--mono);font-size:9px;color:#fff;opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.tb.rio{background-color:var(--ink)}.tb.rio .n{color:var(--accent)}
.tb.travel{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px);box-shadow:none;cursor:default}
.tb .hd{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.18)}
.tb .hd:hover,.tb.dragging .hd{background:var(--accent)}
.timeline .anc{position:absolute;top:-4px;width:2px;height:72px;background:var(--bad);z-index:2}
.timeline .anc.ok{background:var(--good)}
.timeline .anc i{position:absolute;left:-5px;top:-6px;width:12px;height:12px;border-radius:50%;background:inherit;border:2px solid var(--bg2)}
.timeline .foot{font-size:11px;color:var(--faint);display:flex;justify-content:space-between}
.cal{display:grid;gap:12px;padding:4px 12px 12px}
.cm h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .dh{font-size:10px;color:var(--faint);text-align:center;font-family:var(--mono)}
.cd{position:relative;min-height:38px;border-radius:7px;background:var(--surface2);border:1px solid var(--line2);padding:3px 4px;text-align:left;display:grid;align-content:start;gap:1px;overflow:hidden;transition:transform .1s}
.cd:hover{transform:scale(1.06);z-index:1;border-color:var(--accent)}
.cd b{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink)}
.cd small{font-size:9px;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:600}
.cd.we b{color:var(--accent2)}
.cd.off{opacity:.3}
.cd.travel{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}
.cd.today{outline:2px solid var(--teal);outline-offset:-2px}
.cd.cur{outline:2px solid var(--ink);outline-offset:-2px}
.cd i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
.cd i.am{border-radius:2px;background:var(--good)}.cd i.am.miss{background:var(--bad)}
.cd i.em{right:12px}.cd i.em.closure{background:var(--bad)}.cd i.em.event{background:var(--teal)}.cd i.em.warn{background:var(--warn)}
.altp{background:var(--bg2);border-radius:12px;padding:8px 12px 10px}
.altp .ah{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.altp svg{width:100%;height:80px;display:block}
.altp .area{fill:var(--accent);fill-opacity:.18}
.altp .line{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.altp .l3k{stroke:var(--bad);stroke-dasharray:4 4;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
.altp text{font-family:var(--mono);font-size:9px;fill:var(--muted);text-anchor:middle}
.rlist{display:grid;gap:0}
.rstop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);position:relative;transition:border-color .15s,box-shadow .15s}
.rstop:hover{border-color:var(--line)}
.rstop.drag{opacity:.4}
.rstop.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rstop.cur{border-color:var(--accent)}
.rstop.done{opacity:.6}
.rstop .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:11px;font-weight:600;display:grid;place-items:center}
.rstop.locked .num{background:var(--ink);color:var(--bg)}
.rstop .who{display:grid;gap:1px;min-width:0}
.rstop .who b{font-family:var(--display);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstop .who b:hover{color:var(--accent)}
.rstop .who small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rstop .who .flags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.rstop .who .flags i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rstop .who .flags i.closure{background:var(--bad)}.rstop .who .flags i.event{background:var(--teal)}.rstop .who .flags i.warn{background:var(--warn)}.rstop .who .flags i.anc{background:var(--good);border-radius:2px}.rstop .who .flags i.anc.miss{background:var(--bad)}
.rstop .ctl{display:flex;align-items:center;gap:3px}
.rstop .ctl .stepper button{width:26px;height:28px;font-size:14px}
.rstop .ctl .stepper b{min-width:40px;font-size:12px}
.icon{width:26px;height:28px;border-radius:7px;color:var(--muted);display:grid;place-items:center;font-size:13px}
.icon:hover{background:var(--bg2);color:var(--ink)}
.icon.x:hover{color:var(--bad)}
.grip{cursor:grab;color:var(--faint);font-size:14px;letter-spacing:-2px;user-select:none;padding:0 4px}
.leg{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:5px 10px;align-items:center;font-size:12px;color:var(--muted)}
.leg .ln{width:26px;display:grid;justify-items:center}
.leg .ln i{width:0;border-left:2px dashed var(--line);height:24px}
.leg .txt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.leg .mode{font-weight:700;color:var(--ink2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;gap:5px;align-items:center}
.leg .mode svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.leg .mono{color:var(--ink2)}
.leg .nt{color:var(--faint);flex-basis:100%;font-size:11.5px}
.leg.warn .mode{color:var(--warn)}
.leg .altsw{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.leg .altsw button{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--ink2);font-family:var(--mono)}
.leg .altsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.leg .altsw button:hover{border-color:var(--accent)}
.leg .src{font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;letter-spacing:.06em}
.rins{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px}
.rins button{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line);color:var(--muted);font-size:14px;line-height:1;transition:all .15s;background:transparent}
.rins button:hover,.rins button.armed{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);transform:scale(1.15)}
.rins span{font-size:11px;color:var(--faint)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:grid;justify-items:center;gap:6px;padding:12px 6px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--ink2);transition:all .15s;text-align:center}
.act:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-1px)}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px var(--accent-glow)}
.act svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more{position:relative;display:grid}.more>.act{width:100%}
.more .menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:5}
.more.open .menu{display:grid;gap:1px}
.more .menu button{text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.more .menu button:hover{background:var(--accent-soft);color:var(--ink)}
.more .menu button.danger{color:var(--bad)}
/* saved routes */
.saved{display:grid;gap:8px;background:var(--bg2);border-radius:12px;padding:12px}
.saved h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.srow.cmp{border-color:var(--teal)}
.srow.active{border-color:var(--accent)}
.tagactive{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.srow b{font-family:var(--display);font-size:14px;font-weight:700;display:block}
.srow small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.srow .b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.srow .b button{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:var(--ink2)}
.srow .b button:hover{border-color:var(--accent);color:var(--accent2)}
.srow .b button.on{background:var(--teal);color:#062A28;border-color:var(--teal)}
/* overland alternative */
.overland{grid-column:2;margin:2px 0 6px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink2);display:grid;gap:5px}
.overland b{color:var(--ink)}
.overland .path{font-size:12px}
.overland .path i{font-style:normal;color:var(--teal);font-weight:700}
.overland button{justify-self:start;font-size:11.5px;font-weight:700;background:var(--teal);color:#062A28;border-radius:8px;padding:5px 10px}
/* hostel v2 */
.hostel .hwpix{display:none;grid-column:1/-1;position:relative;grid-template-columns:repeat(4,1fr);gap:2px;height:120px;background:var(--bg2)}
.hostel.open.haspix .hwpix{display:grid}
.hostel.open.haspix .vibehead{grid-template-columns:auto 1fr;padding:8px 14px}
.hostel .hwpix img{width:100%;height:120px;object-fit:cover;display:block}
.hostel .hwpix .hwlink{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:4px 9px;border-radius:7px;text-decoration:none}
.hostel .vibehead{display:none;grid-column:1/-1;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;color:#fff}
.hostel.open .vibehead{display:grid}
